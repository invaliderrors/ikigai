<!doctype html>
<meta charset="utf-8">
<title>Lantern Field</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#070915}canvas{display:block;width:100vw;height:100vh}</style>
<canvas id="c"></canvas>
<script>
// Lantern Field — an original Ikigai starter wallpaper. Draws at 30 fps and stops while Ikigai pauses it.
const c = document.getElementById('c'), x = c.getContext('2d');
const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
let W, H, t = 0, last = 0, running = true, stars = [], lanterns = [];

// One pre-drawn glow, stamped for every lantern: far cheaper than a gradient per lantern per frame.
const glow = document.createElement('canvas'); glow.width = glow.height = 64;
{ const g = glow.getContext('2d'), r = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  r.addColorStop(0, 'rgba(255,214,140,1)'); r.addColorStop(.18, 'rgba(255,170,80,.9)'); r.addColorStop(1, 'rgba(255,120,40,0)');
  g.fillStyle = r; g.fillRect(0, 0, 64, 64); }

function rand(seed) { return () => (seed = (seed * 16807) % 2147483647) / 2147483647; }
function size() {
  const d = Math.min(devicePixelRatio, 1.5); W = c.width = innerWidth * d; H = c.height = innerHeight * d;
  const r = rand(7);
  stars = Array.from({ length: 160 }, () => [r() * W, r() * H * .55, r() * 1.4 + .3, r() * 6]);
  lanterns = Array.from({ length: 70 }, () => ({ x: r() * W, y: r() * H, s: r() * .8 + .4, sway: r() * 6, v: r() * .5 + .5 }));
  draw();
}
addEventListener('resize', size);
document.addEventListener('ikigai:pause', () => running = false);
document.addEventListener('ikigai:resume', () => { if (!running) { running = true; last = 0; requestAnimationFrame(loop); } });
function loop(now) {
  if (!running) return;
  if (!last) last = now;
  if (now - last >= 33) { const dt = (now - last) / 1000 * (still ? 0.12 : 1); t += dt; last = now; step(dt); draw(); }
  requestAnimationFrame(loop);
}

function step(dt) {
  for (const l of lanterns) {
    l.y -= H * .012 * l.v * l.s * dt;
    if (l.y < -40) { l.y = H + 40; l.x = Math.random() * W; }
  }
}

function hill(y, amp, freq, color) {
  x.beginPath(); x.moveTo(0, H);
  for (let px = 0; px <= W + 10; px += 10) x.lineTo(px, H * y + Math.sin(px / W * Math.PI * freq) * H * amp + Math.sin(px / W * 17) * H * .006);
  x.lineTo(W, H); x.closePath(); x.fillStyle = color; x.fill();
}

function draw() {
  const sky = x.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0, '#060814'); sky.addColorStop(.6, '#1c1233'); sky.addColorStop(1, '#3a1a2e');
  x.fillStyle = sky; x.fillRect(0, 0, W, H);
  for (const [sx, sy, sr, sp] of stars) {
    x.globalAlpha = .45 + .35 * Math.sin(t * 1.3 + sp);
    x.fillStyle = '#fff4dc'; x.fillRect(sx, sy, sr, sr);
  }
  x.globalAlpha = 1;
  hill(.70, .05, 2.2, '#1a1026');
  x.globalCompositeOperation = 'lighter';
  for (const l of lanterns) {
    const s = 34 * l.s * (H / 900), px = l.x + Math.sin(t * .6 + l.sway) * 14 * l.s;
    x.globalAlpha = .55 + .25 * Math.sin(t * 2 + l.sway);
    x.drawImage(glow, px - s / 2, l.y - s / 2, s, s);
  }
  x.globalCompositeOperation = 'source-over'; x.globalAlpha = 1;
  hill(.80, .035, 3.1, '#120a1a');
  hill(.90, .03, 1.6, '#09060f');
}
size(); requestAnimationFrame(loop);
</script>
