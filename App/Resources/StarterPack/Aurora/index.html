<!doctype html>
<meta charset="utf-8">
<title>Aurora</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#030812}canvas{display:block;width:100vw;height:100vh}</style>
<canvas id="c"></canvas>
<script>
// Aurora — an original Ikigai starter wallpaper. Draws at 30 fps and stops while Ikigai pauses it.
const c = document.getElementById('c'), x = c.getContext('2d');
const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
let W, H, t = 0, last = 0, running = true, stars = [];

function rand(seed) { return () => (seed = (seed * 16807) % 2147483647) / 2147483647; }
function size() {
  const d = Math.min(devicePixelRatio, 1.5); W = c.width = innerWidth * d; H = c.height = innerHeight * d;
  const r = rand(11); stars = Array.from({ length: 220 }, () => [r() * W, r() * H * .7, r() * 1.3 + .3]);
  draw();
}
addEventListener('resize', size);
document.addEventListener('ikigai:pause', () => running = false);
document.addEventListener('ikigai:resume', () => { if (!running) { running = true; last = 0; requestAnimationFrame(loop); } });
function loop(now) {
  if (!running) return;
  if (!last) last = now;
  if (now - last >= 33) { t += (now - last) / 1000 * (still ? 0.12 : 1); last = now; draw(); }
  requestAnimationFrame(loop);
}

// Each curtain is a ribbon of vertical strokes whose top edge and brightness drift over time.
const curtains = [
  { y: .22, len: .30, color: [92, 255, 178], speed: .12, f: 2.1, a: .22 },
  { y: .30, len: .24, color: [120, 200, 255], speed: .09, f: 3.3, a: .16 },
  { y: .18, len: .20, color: [190, 120, 255], speed: .15, f: 1.4, a: .12 },
];

function draw() {
  const sky = x.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0, '#02050d'); sky.addColorStop(.7, '#0a1d33'); sky.addColorStop(1, '#0d2a3a');
  x.fillStyle = sky; x.fillRect(0, 0, W, H);
  x.fillStyle = '#e8f4ff';
  for (const [sx, sy, sr] of stars) x.fillRect(sx, sy, sr, sr);

  x.globalCompositeOperation = 'lighter';
  const step = Math.max(3, W / 480);
  for (const cu of curtains) {
    const [r, g, b] = cu.color;
    for (let px = 0; px < W; px += step) {
      const u = px / W;
      const top = H * (cu.y + .06 * Math.sin(u * Math.PI * cu.f + t * cu.speed * 6) + .03 * Math.sin(u * 13 - t * cu.speed * 4));
      const shimmer = .5 + .5 * Math.sin(u * 40 + t * 1.7) * Math.sin(u * 7 - t * .9);
      const len = H * cu.len * (.7 + .3 * shimmer);
      const grad = x.createLinearGradient(0, top, 0, top + len);
      grad.addColorStop(0, `rgba(${r},${g},${b},0)`);
      grad.addColorStop(.25, `rgba(${r},${g},${b},${cu.a * (.6 + .4 * shimmer)})`);
      grad.addColorStop(1, `rgba(${r},${g},${b},0)`);
      x.fillStyle = grad; x.fillRect(px, top, step + 1, len);
    }
  }
  x.globalCompositeOperation = 'source-over';

  // Peaked mountains, then the aurora's faint reflection on the water below them.
  x.fillStyle = '#050b14'; x.beginPath(); x.moveTo(0, H);
  for (let px = 0; px <= W + 8; px += 8) {
    const u = px / W, peak = Math.pow(1 - Math.abs(Math.sin(u * 4.4 + .6)), 2.2);
    x.lineTo(px, H * (.80 - .13 * peak - .025 * Math.pow(1 - Math.abs(Math.sin(u * 17)), 2)));
  }
  x.lineTo(W, H); x.closePath(); x.fill();
  const lake = x.createLinearGradient(0, H * .86, 0, H);
  lake.addColorStop(0, 'rgba(92,255,178,0)'); lake.addColorStop(.35, 'rgba(92,255,178,.06)'); lake.addColorStop(1, 'rgba(92,255,178,0)');
  x.fillStyle = lake; x.fillRect(0, H * .86, W, H * .14);
}
size(); requestAnimationFrame(loop);
</script>
