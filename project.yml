# XcodeGen spec — the source of truth for Ikigai.xcodeproj (run `xcodegen generate`).
name: Ikigai
options:
  bundleIdPrefix: com.invaliderrors
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

packages:
  IkigaiKit:
    path: Packages/IkigaiKit

targets:
  Ikigai:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes: [Resources/StarterPack/**]
      # A folder reference, copied as is: each wallpaper keeps its own folder (and its own index.html).
      - path: App/Resources/StarterPack
        type: folder
        buildPhase: resources
    dependencies:
      - package: IkigaiKit
        product: IkigaiCore
      - package: IkigaiKit
        product: IkigaiRender
      - package: IkigaiKit
        product: IkigaiDesktop
    scheme: {}
    # Merged with the generated Info.plist keys below; the file itself is generated, not committed.
    info:
      path: App/Info.plist
      properties:
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.invaliderrors.ikigai.wallpaper
            UTTypeDescription: Ikigai Wallpaper
            UTTypeConformsTo: [public.data, public.archive]
            UTTypeTagSpecification:
              public.filename-extension: [ikigai]
        CFBundleDocumentTypes:
          - CFBundleTypeName: Ikigai Wallpaper
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes: [com.invaliderrors.ikigai.wallpaper]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.invaliderrors.ikigai
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Ikigai
        INFOPLIST_KEY_LSUIElement: YES   # menu bar app, no Dock icon
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.entertainment
        INFOPLIST_KEY_NSHumanReadableCopyright: "© 2026 invaliderrors. All rights reserved."
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        CODE_SIGN_IDENTITY: "-"   # sign to run locally; set a team for distribution (Phase 1)
